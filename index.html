<style id="lockcss">
body.lock{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1F3A5F;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430;padding:16px;box-sizing:border-box}
.lk{background:#fff;border-radius:16px;padding:22px 18px;width:100%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.25)}

.lk .msg{min-height:20px;font-size:14px;margin-top:10px;color:#C62828}

var te=new TextEncoder();
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function hex(u){return Array.prototype.map.call(u,function(b){return ('0'+b.toString(16)).slice(-2)}).join('')}
async function master(pw){var k=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(SALT),iterations:ITER,hash:'SHA-256'},k,256))}
async function hk(m,info){var k=await crypto.subtle.importKey('raw',m,'HKDF',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode(info)},k,256))}
async function unlock(m,remember){
  var pk=await crypto.subtle.importKey('raw',await hk(m,'page-v1'),'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(IV)},pk,unb64(CT));
  var P=JSON.parse(new TextDecoder().decode(pt));
  if(remember)localStorage.setItem('kat_m',b64(m));else sessionStorage.setItem('kat_m',b64(m));
  var sk=await crypto.subtle.importKey('raw',await hk(m,'sync-v1'),'AES-GCM',false,['encrypt','decrypt']);
  window.APP={syncKey:sk,token:hex(await hk(m,'token-v1')),logout:function(){localStorage.removeItem('kat_m');sessionStorage.removeItem('kat_m');location.hash='';location.reload()}};
  window.DATA=P.data;
  var st=document.createElement('style');st.textContent=P.css;document.head.appendChild(st);
  document.getElementById('lockcss').remove();document.title='Λίστα κλήσεων – Κατασκευαστές για οικόπεδο στο Αιγάλεω';
  document.body.className='';document.body.innerHTML=P.body;
  var run=function(){(new Function(P.js))()};
  if(typeof L==='undefined'&&document.readyState!=='complete')window.addEventListener('load',run);else run();
}
var saved=localStorage.getItem('kat_m')||sessionStorage.getItem('kat_m');
if(saved){unlock(unb64(saved),!!localStorage.getItem('kat_m')).catch(function(){localStorage.removeItem('kat_m');sessionStorage.removeItem('kat_m')})}
document.getElementById('shw').onclick=function(){var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'};
document.getElementById('lk').addEventListener('submit',async function(e){e.preventDefault();var msg=document.getElementById('msg'),b=document.getElementById('go');
  if(!window.crypto||!crypto.subtle){msg.textContent='Ο φυλλομετρητής δεν υποστηρίζει κρυπτογράφηση (χρειάζεται https).';return}
  b.disabled=true;b.textContent='Άνοιγμα…';msg.textContent='';
  try{var m=await master(document.getElementById('pw').value.trim());await unlock(m,document.getElementById('rm').checked)}
  catch(err){b.disabled=false;b.textContent='Άνοιγμα';msg.textContent='Λάθος κωδικός. Δοκιμάστε ξανά.'}});
})();
